name: Bug report
description: Report a reproducible problem.
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Start the app with ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you run it (Docker, Dokploy, from source), OS, browser if relevant, and your OpenID Connect provider if sign-in is involved.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove secrets, tokens and personal data first.
      render: text
